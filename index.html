<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Bike Digital Speedo</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* หน้าจอแสดงผล */
        .dash {
            text-align: center;
            border: 4px solid #444;
            border-radius: 40px;
            padding: 30px;
            width: 80%;
            max-width: 320px;
            background: linear-gradient(145deg, #111, #222);
            box-shadow: inset 0 0 15px #000, 0 10px 30px rgba(0,0,0,0.5);
        }

        .label {
            font-size: 14px;
            color: #00e5ff;
            letter-spacing: 3px;
            margin-bottom: -10px;
        }

        #speed {
            font-size: 100px;
            font-weight: 900;
            color: #fff;
            margin: 0;
            font-family: 'Courier New', Courier, monospace; /* ให้ฟีลตัวเลขดิจิทัล */
        }

        .unit {
            font-size: 20px;
            color: #888;
            margin-top: -10px;
        }

        /* ปุ่มกด */
        .btn-start {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 18px;
            background-color: #00e5ff;
            color: #000;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .btn-start:active {
            transform: scale(0.95);
            background-color: #00b8cc;
        }

        #status {
            margin-top: 15px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="dash">
        <div class="label">SPEED</div>
        <p id="speed">00</p>
        <div class="unit">km/h</div>
    </div>

    <button class="btn-start" onclick="initGPS()">START DASHBOARD</button>
    
    <div id="status">กดปุ่มเพื่อเริ่มเชื่อมต่อ GPS</div>

    <script>
        let watchId = null;

        function initGPS() {
            const speedDisplay = document.getElementById('speed');
            const statusDisplay = document.getElementById('status');

            if ("geolocation" in navigator) {
                statusDisplay.textContent = "กำลังขอสิทธิ์ใช้งาน GPS...";
                
                // เริ่มติดตามตำแหน่ง
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        statusDisplay.textContent = "เชื่อมต่อสำเร็จ (สัญญาณ GPS ปกติ)";
                        statusDisplay.style.color = "#00e5ff";

                        // ดึงค่าความเร็ว (หน่วยเป็นเมตรต่อวินาที)
                        let speedMS = position.coords.speed;

                        if (speedMS !== null && speedMS > 0) {
                            // แปลงเป็น km/h
                            let speedKMH = Math.round(speedMS * 3.6);
                            speedDisplay.textContent = speedKMH.toString().padStart(2, '0');
                        } else {
                            speedDisplay.textContent = "00";
                        }
                    },
                    (error) => {
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                statusDisplay.textContent = "คุณปฏิเสธการเข้าถึง GPS";
                                break;
                            case error.POSITION_UNAVAILABLE:
                                statusDisplay.textContent = "ไม่สามารถระบุตำแหน่งได้";
                                break;
                            case error.TIMEOUT:
                                statusDisplay.textContent = "การเชื่อมต่อหมดเวลา";
                                break;
                            default:
                                statusDisplay.textContent = "เกิดข้อผิดพลาด: " + error.message;
                        }
                        statusDisplay.style.color = "#ff4444";
                    },
                    {
                        enableHighAccuracy: true, // ใช้ความแม่นยำสูงสุด
                        maximumAge: 0,
                        timeout: 10000
                    }
                );
            } else {
                statusDisplay.textContent = "อุปกรณ์ของคุณไม่รองรับ GPS";
            }
        }
    </script>
</body>
</html>
